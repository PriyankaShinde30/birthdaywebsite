const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
Object.entries(L).forEach(([pg,arr])=>{
  $('#'+pg+'s').outerHTML=arr.map(([f,x,y,w,r,z,a])=>`<img class="s ${a}" src="assets/${f}.png" style="left:${x}px;top:${y}px;width:${w}px;z-index:${z};transform:rotate(${r}deg);--r:${r}deg">`).join('');
});
$('#p3').insertAdjacentHTML('beforeend','<h1 class="title script" style="top:215px;font-size:56px">Yay!! Happy Birthdayyy</h1>');
const gp=(x,y,w,h,cls='')=>`<div class="gp ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-position:${-x%52}px ${-y%52}px"></div>`;
const cornerR=(w,h)=>gp(1280-w,720-h,w,h,'torn-corner')+gp(1280,720-.72*h,400,400+.72*h)+gp(1280-w,720,w,400);
const cornerL=(w,h)=>gp(0,720-h,w,h,'torn-corner-l')+gp(-400,720-.72*h,400,400+.72*h)+gp(0,720,w,400);
const panel=w=>gp(-400,-400,w+400,1520,'torn-r');
const ging=(p,html)=>$('#'+p).insertAdjacentHTML('afterbegin',html);
['p2','p3','p4','p5'].forEach(p=>ging(p,cornerR(380,240)+cornerL(380,240)));
ging('p1',gp(-400,-400,510,1520));
ging('p6',cornerR(380,220));
ging('p7',panel(470)+cornerR(380,220));
ging('p8',panel(190)+cornerR(380,240));

function fit(){const k=Math.min(innerWidth/1280,innerHeight/720),st=$('#stage');st.style.width=innerWidth/k+'px';st.style.height=innerHeight/k+'px';st.style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();

let cur=1;
function go(n){
  $$('.page').forEach(p=>p.classList.remove('on'));$('#p'+n).classList.add('on');cur=n;
  $('#back').style.display=(n>5&&n<9)?'block':'none';
  if(n===2)resetCake(); if(n===3)confetti(70);
}
$$('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
$('#back').onclick=()=>go(5);
$('#nameLine').textContent=CFG.name+(CFG.date?' · '+CFG.date:'');

const DEF={cover:'cover',l1:'g1a',l2:'g1b',f1:'g2a',f2:'g2b',f3:'g2c',b1:'g3a',b2:'g3b'};
function setPhoto(el,src){el.style.backgroundImage=`url(${src})`;[...el.childNodes].forEach(n=>{if(n.nodeType===3)n.textContent=''});}
$$('.photo').forEach(el=>{
  const k='bd_'+el.dataset.key, inp=el.querySelector('input');
  let st=null;try{st=localStorage.getItem(k)}catch(e){}
  setPhoto(el,st||('assets/photos/'+DEF[el.dataset.key]+'.jpg'));
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas'),m=800,sc=Math.min(1,m/Math.max(img.width,img.height));c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',.82);setPhoto(el,d);try{localStorage.setItem(k,d)}catch(e){}};img.src=r.result};r.readAsDataURL(f)};
});

const WK=[[109,62],[139,65],[166,53],[176,45],[199,50],[214,33],[245,48],[253,58],[277,53],[306,53],[327,58]];
function resetCake(){
  $('#cake').classList.remove('out');$('#flames').innerHTML=WK.map(([x,y])=>`<div class="smoke" style="left:${x/428*100}%;top:${(y-60)/375*100}%"></div>`).join('');
  $('#t2').textContent='Blow out the Candles !!!';$('#hint2').style.display='';
}
function blow(){const c=$('#cake');if(c.classList.contains('out')||cur!==2)return;c.classList.add('out');$('#t2').textContent='Make a wish...';$('#hint2').style.display='none';confetti(50);setTimeout(()=>go(3),2600)}
$('#cake').onclick=blow;
$('#hint2').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),a=new AudioContext(),an=a.createAnalyser();a.createMediaStreamSource(s).connect(an);const d=new Uint8Array(an.fftSize);
  (function t(){an.getByteTimeDomainData(d);let m=0;d.forEach(v=>m=Math.max(m,Math.abs(v-128)));if(m>90&&cur===2){blow();s.getTracks().forEach(t=>t.stop());return}requestAnimationFrame(t)})()}catch(e){}};

$('#yes').onclick=()=>go(5);
let nos=0;
$('#noBtn').onclick=()=>{nos++;$('#t4').textContent='Please try again';const b=$('#noBtn');b.style.left=(600+Math.random()*420)+'px';b.style.top=(470+Math.random()*130)+'px';b.style.fontSize=Math.max(22,40-nos*4)+'px';setTimeout(()=>$('#t4').textContent='Accept your gifts?',1600)};

$('#dear').textContent=CFG.dear;
$('#letterBody').innerHTML=CFG.letter.map(p=>`<p>${p}</p>`).join('')+`<p style="text-align:right;font-weight:800;font-size:16px;color:#16335e;line-height:1.35">${CFG.signoff.join('<br>')}</p>`;
$('#bookL').textContent=CFG.bookLeft;$('#bookNote').textContent=CFG.bookNote;
$('#bookR').innerHTML=CFG.bookRight.map(p=>`<p>${p}</p>`).join('');

function confetti(n){const c=['#3b78c4','#a9c8f2','#fff','#16335e','#c0c7d6','#f2c94c'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='confetti';e.style.background=c[i%c.length];e.style.left=Math.random()*100+'vw';e.style.animationDuration=(2+Math.random()*3)+'s';e.style.animationDelay=Math.random()*.8+'s';e.style.borderRadius=i%3?'2px':'50%';document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}

resetCake();
</script>
</body>
</html>
